syntax = "proto3";

package model_context_protocol;

option go_package = "./;main";

import "google/protobuf/struct.proto";

service ExtMcp {

  rpc mutate_request(McpRequest) returns (MutatedMcpRequest);
  rpc mutate_response(McpResponse) returns (MutatedMcpResponse);

}

message McpRequest {
  string service_name = 1;

  // Dynamic metadata associated with the request.
  Metadata metadata_context = 2;

  google.protobuf.Struct mcp_request = 3;
  
}

message MutatedMcpRequest {
  oneof result {
    AuthorizationError error = 1;
    google.protobuf.Struct mcp_request = 2;
  }
}

message McpResponse {
  string service_name = 1;

  // Dynamic metadata associated with the request.
  Metadata metadata_context = 2;

  google.protobuf.Struct mcp_response = 3;
}

message MutatedMcpResponse {
  google.protobuf.Struct mcp_request = 1;
}

message Metadata {
  // Key is the reverse DNS filter name, e.g. com.acme.widget. The ``envoy.*``
  // namespace is reserved for Envoy's built-in filters.
  // If both ``filter_metadata`` and
  // :ref:`typed_filter_metadata <envoy_v3_api_field_config.core.v3.Metadata.typed_filter_metadata>`
  // fields are present in the metadata with same keys,
  // only ``typed_filter_metadata`` field will be parsed.
  map<string, google.protobuf.Struct> filter_metadata = 1;
}

message AuthorizationError {
  string resource = 1;
  string name = 2;
}